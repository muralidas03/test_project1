{% extends 'base.html' %}

{% block title %}Access Denied{% endblock %}

{% block content %}
<div class="row animate-fade-in justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-lg-6 text-center">
        <div class="glass-card p-5">
            <div class="rounded-circle bg-danger bg-opacity-10 d-inline-flex align-items-center justify-content-center mb-4" style="width: 120px; height: 120px;">
                <i class="bi bi-shield-exclamation text-danger" style="font-size: 4rem;"></i>
            </div>
            <h1 class="fw-bold text-white mb-2">403 Restricted</h1>
            <p class="text-muted mb-5">You do not have the required permissions to access this vector. Please contact your system administrator if you believe this is an error.</p>
            
            <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                <a href="{% url 'dashboard' %}" class="btn btn-primary px-5 fw-bold py-2">Return to Command Center</a>
                <a href="javascript:history.back()" class="btn btn-secondary bg-secondary bg-opacity-25 border-0 text-white px-5 fw-bold py-2">Go Back</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
